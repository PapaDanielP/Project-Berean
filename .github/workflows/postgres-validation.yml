name: PostgreSQL reference validation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: berean
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d berean"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate reference schema and fixtures
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/berean
          PGPASSWORD: postgres
        run: scripts/validation/run-postgres-validation.sh
