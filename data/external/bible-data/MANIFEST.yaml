manifest_version: 2

source:
  name: BibleData
  author: Brady Stephenson
  repository: BradyStephenson/bible-data
  repository_url: https://github.com/BradyStephenson/bible-data
  branch: main
  pinned_commit: c6bf7893c78352effad1c32dcc4dc2c0ffbb4ee1
  release_version: "1.0"
  release_date: "2026-04-12"
  doi: 10.5281/zenodo.19539956
  source_type: structured_bible_data
  edition_label: BibleData 1.0 at pinned commit

attribution:
  required: true
  preferred_text: >-
    BibleData: Structured Datasets from the Holy Bible, by Brady Stephenson.
  author: Brady Stephenson
  copyright_holder: Brady Stephenson
  project_url: https://github.com/BradyStephenson/bible-data
  doi: 10.5281/zenodo.19539956
  attribution_placement:
    - source_metadata
    - dataset_metadata
    - distributed_data_notice
    - documentation

license:
  verification_status: verified_by_project_maintainer
  verified_on: "2026-08-10"
  verified_by: project_maintainer
  permission_to_use_confirmed: true
  permission_scope:
    copy: true
    redistribute: true
    adapt: true
    commercial_use: true
  upstream_declarations_preserved:
    - identifier: CC-BY-4.0
      evidence:
        - README
        - LICENSE
    - identifier: CC-BY-NC-SA-4.0
      evidence:
        - CITATION.cff
  effective_license_identifier: not_selected_in_repository_metadata
  effective_license_name: not_selected_in_repository_metadata
  resolution_note: >-
    The project maintainer has confirmed that Berean may use the source data
    with attribution. Berean does not independently replace or erase the
    upstream license declarations. The applicable license terms for each
    imported dataset or file must be recorded before distribution, including
    any noncommercial, ShareAlike, attribution, or modification obligations.
  obligations:
    attribution: true
    indicate_modifications: true
    preserve_upstream_license_notices: true
    preserve_source_identifiers: true
    record_dataset_level_terms: true
  import_gate:
    permitted_for_local_inspection: true
    permitted_for_berean_population: true
    permitted_for_public_redistribution: verify_per_dataset_before_distribution

acquisition:
  status: pending
  acquisition_method: pinned_upstream_repository
  acquisition_revision: c6bf7893c78352effad1c32dcc4dc2c0ffbb4ee1
  source_text_inspected: false
  imported_files: []

berean_import_policy:
  source_backed_assertions_allowed_after_acquisition: true
  raw_source_distinct_from_canonical_records: true
  required_workflow:
    - Source
    - Dataset
    - SourceRecord
    - Citation
    - Evidence
    - Proposition
    - Claim
    - ClaimEvidence
    - Entity_or_Event_relationships
    - optional_Derivation
    - validation
