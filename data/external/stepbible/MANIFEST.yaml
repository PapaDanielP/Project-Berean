manifest_version: 2

source:
  name: STEP Bible Data
  repository: STEPBible/STEPBible-Data
  repository_url: https://github.com/STEPBible/STEPBible-Data
  branch: master
  pinned_commit: b86d26cdb1f51729e73b5b4eb7f7ccadc5dfba39
  source_type: structured_bible_data
  edition_label: STEP Bible Data repository at pinned commit

attribution:
  required: true
  preferred_text: >-
    Data from STEP Bible, initially created by Tyndale House Cambridge and
    curated by STEP Bible.
  required_credit: STEP Bible
  project_url: https://www.STEPBible.org
  additional_attribution:
    - Tyndale House, Cambridge
  attribution_placement:
    - source_metadata
    - dataset_metadata
    - distributed_data_notice
    - documentation

license:
  verification_status: verified
  verified_on: "2026-08-10"
  verified_by: project_maintainer
  repository_level_identifier: CC-BY-4.0
  repository_level_name: Creative Commons Attribution 4.0 International
  dataset_level_verification_required: true
  dataset_level_status: verified_before_import
  notes:
    - >-
      Dataset-specific license notices remain authoritative for each imported
      file and must be recorded in the corresponding Dataset metadata.
    - >-
      Files with a more restrictive or different license must not inherit the
      repository-level license automatically.
  permissions_confirmed:
    copy: true
    redistribute: true
    adapt: true
    commercial_use: true
  obligations:
    attribution: true
    indicate_modifications: true
    preserve_license_notice: true
    record_source_differences: true

acquisition:
  status: acquired_not_redistributed
  acquisition_method: pinned_raw_file_download
  acquisition_revision: b86d26cdb1f51729e73b5b4eb7f7ccadc5dfba39
  acquired_on: "2026-08-10"
  source_text_inspected: true
  acquisition_manifest: data/external/stepbible/ACQUISITION_MANIFEST.yaml
  acquisition_script: scripts/acquisition/fetch-stepbible.sh
  inspection_results: data/external/stepbible/INSPECTION.md
  redistributed_files: []
  acquired_files:
    - >-
      Translators Amalgamated OT+NT/TAHOT Gen-Deu - Translators Amalgamated Hebrew OT - STEPBible.org CC BY.txt
  file_level_redistribution_restriction: >-
    The acquired file's own notice asks downstream users not to redistribute the data
    themselves and to refer others to github.com/STEPBible. Berean preserves that stricter
    file-level condition, so no upstream payload is stored in this repository.

status:
  permission_and_license_verified: true
  acquired: true
  inspected: true
  imported: partial
  imported_scope: >-
    One Genesis source record (locator Gen.1.1) is imported into the reference model as
    provenance metadata only: source, dataset, source record, citation, evidence, claim
    evidence, and claims that reuse existing Genesis 1:1 propositions. No upstream text or
    payload is imported.
  pending: >-
    All other upstream files and all other Genesis locators remain unacquired,
    file-level-license-unverified, and unimported.

berean_import_policy:
  source_backed_assertions_allowed_after_acquisition: true
  raw_source_distinct_from_canonical_records: true
  required_workflow:
    - Source
    - Dataset
    - SourceRecord
    - Citation
    - Evidence
    - Proposition
    - Claim
    - ClaimEvidence
    - Entity_or_Event_relationships
    - optional_Derivation
    - validation
